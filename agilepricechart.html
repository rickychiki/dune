<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Octopus Agile Region G — 10 Day Price Chart</title>

  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

  <style>
    :root {
      --bg: #101218;
      --panel: #181b23;
      --panel2: #20242e;
      --border: #303642;
      --text: #edf1f7;
      --muted: #9da6b5;
      --actual: #4da3ff;
      --forecast: #ff9f43;
      --warning: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .container {
      max-width: 1500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }

    .panel {
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    textarea {
      width: 100%;
      height: 170px;
      resize: vertical;

      background: #0e1015;
      color: #e8edf5;

      border: 1px solid var(--border);
      border-radius: 7px;

      padding: 10px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Consolas,
        monospace;

      font-size: 12px;
      line-height: 1.45;
    }

    textarea:focus {
      outline: none;
      border-color: #4da3ff;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel2);
      color: var(--text);
      padding: 9px 15px;
      cursor: pointer;
    }

    button:hover {
      background: #292e39;
    }

    button.primary {
      background: #245f91;
      border-color: #327bb7;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 7px;
      background: #12151b;
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.5;
    }

    .status.warning {
      color: var(--warning);
    }

    .status.error {
      color: #ff7373;
    }

    .status.ok {
      color: #69d391;
    }

    .chart-panel {
      position: relative;
      height: min(70vh, 750px);
      min-height: 450px;
    }

    .chart-wrapper {
      width: 100%;
      height: 100%;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .info {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
    }

    .info-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .info-value {
      margin-top: 4px;
      font-size: 14px;
    }

    .warning-overlay {
      display: none;

      position: absolute;
      z-index: 5;

      left: 20px;
      right: 20px;
      top: 20px;

      padding: 9px 12px;

      border-radius: 7px;

      background: rgba(65, 50, 20, .94);
      border: 1px solid rgba(255, 209, 102, .4);

      color: #ffd166;

      font-size: 12px;
    }

    @media(max-width: 800px) {

      .container {
        padding: 12px;
      }

      .input-grid {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .chart-panel {
        height: 60vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Octopus Agile — Region G</h1>

      <div class="subtitle">
        North West England · 10 calendar days · Europe/London · p/kWh
      </div>
    </header>


    <!-- =========================================================
         JSON INPUT
         ========================================================= -->

    <div class="panel">

      <div class="input-grid">

        <div>
          <label>
            Actual JSON
            <br>
            <a href="https://api.octopus.energy/v1/products/AGILE-24-10-01/electricity-tariffs/E-1R-AGILE-24-10-01-G/standard-unit-rates/" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center text-xs font-medium text-indigo-600 hover:text-indigo-800 underline my-1 transition-colors">
              Open Octopus api link
            </a>
            <br>
            <small>
              Paste the JSON returned by the Octopus API.
              Leave empty to use dummy actual data.
            </small>
          </label>

          <textarea id="actualJson" placeholder="Paste Octopus API JSON here...

Leave empty for dummy actual prices."></textarea>
        </div>


        <div>
          <label>
            Forecast JSON
            <br>
            <a href="https://agilepredict.com/api/G/?days=10&forecast_count=1&format=json&high_low=true" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center text-xs font-medium text-indigo-600 hover:text-indigo-800 underline my-1 transition-colors">
              Open AgilePredict api link
            </a>
            <br>
            <small>
              Paste the JSON returned by AgilePredict.
              Leave empty to use dummy forecast data.
            </small>
          </label>

          <textarea id="forecastJson" placeholder="Paste AgilePredict JSON here...

Leave empty for dummy forecast prices."></textarea>
        </div>

      </div>


      <div class="controls">

        <button class="primary" id="drawButton">
          Draw Chart
        </button>

        <button id="clearButton">
          Clear JSON
        </button>

        <button id="dummyButton">
          Load Dummy Data
        </button>

      </div>


      <div id="status" class="status">
        Ready. Paste JSON into either box and press "Draw Chart".
        Empty boxes automatically use dummy data.
      </div>

    </div>


    <!-- =========================================================
         CHART
         ========================================================= -->

    <div class="panel chart-panel">

      <div id="warningOverlay" class="warning-overlay"></div>

      <div class="chart-wrapper">
        <canvas id="priceChart"></canvas>
      </div>

    </div>


    <!-- =========================================================
         INFO
         ========================================================= -->

    <div class="info-grid">

      <div class="info">
        <div class="info-title">
          Actual
        </div>

        <div id="actualInfo" class="info-value">
          —
        </div>
      </div>


      <div class="info">
        <div class="info-title">
          Forecast
        </div>

        <div id="forecastInfo" class="info-value">
          —
        </div>
      </div>


      <div class="info">
        <div class="info-title">
          Missing actual
        </div>

        <div id="missingActual" class="info-value">
          —
        </div>
      </div>


      <div class="info">
        <div class="info-title">
          Missing forecast
        </div>

        <div id="missingForecast" class="info-value">
          —
        </div>
      </div>

    </div>

  </div>


  <script>

    "use strict";


    /* ================================================================
       CONSTANTS
       ================================================================ */

    const TIMEZONE = "Europe/London";

    let chart = null;


    /* ================================================================
       DOM
       ================================================================ */

    const actualInput =
      document.getElementById("actualJson");

    const forecastInput =
      document.getElementById("forecastJson");

    const statusElement =
      document.getElementById("status");

    const warningElement =
      document.getElementById("warningOverlay");


    /* ================================================================
       DATE HELPERS
       ================================================================ */

    function londonToday() {

      return luxon.DateTime
        .now()
        .setZone(TIMEZONE)
        .startOf("day");

    }


    /*
     * IMPORTANT:
     *
     * Chart.js receives NUMBER timestamps.
     *
     * Do NOT give Chart.js Date objects here.
     *
     * This fixes:
     *
     * "fromMillis requires a numerical input,
     * but received a object with value Tue..."
     */
    function timestamp(dt) {

      return dt.toMillis();

    }


    function makeSlotList(start, endExclusive) {

      const result = [];

      let current = start;

      while (current < endExclusive) {

        result.push(current);

        current = current.plus({
          minutes: 30
        });

      }

      return result;

    }


    /* ================================================================
       STATUS
       ================================================================ */

    function setStatus(text, type = "") {

      statusElement.textContent = text;

      statusElement.className =
        "status " + type;

    }


    function showWarning(text) {

      if (!text) {

        warningElement.style.display = "none";
        warningElement.textContent = "";

        return;
      }

      warningElement.textContent = text;
      warningElement.style.display = "block";

    }


    /* ================================================================
       JSON
       ================================================================ */

    function parseJson(text, name) {

      if (!text.trim()) {

        return null;

      }

      try {

        return JSON.parse(text);

      } catch (error) {

        throw new Error(
          `${name} contains invalid JSON: ${error.message}`
        );

      }

    }


    /* ================================================================
       ACTUAL DATA
       ================================================================ */

    function parseActualJson(json) {

      const map = new Map();

      if (!json) {

        return map;

      }


      /*
       * Official Octopus response:
       *
       * {
       *   "results": [
       *      {
       *          "valid_from": "...",
       *          "value_inc_vat": ...
       *      }
       *   ]
       * }
       */

      const rows =
        Array.isArray(json)
          ? json
          : Array.isArray(json.results)
            ? json.results
            : [];


      for (const row of rows) {

        if (!row.valid_from) {
          continue;
        }


        const dt =
          luxon.DateTime
            .fromISO(
              row.valid_from,
              {
                zone: "utc"
              }
            )
            .setZone(TIMEZONE);


        if (!dt.isValid) {
          continue;
        }


        /*
         * Octopus returns £/kWh.
         *
         * Convert:
         *
         * £/kWh × 100 = p/kWh
         */

        let price =
          Number(row.value_inc_vat);


        if (!Number.isFinite(price)) {

          price =
            Number(row.value_exc_vat);

        }


        if (!Number.isFinite(price)) {
          continue;
        }

        /*
         * Octopus API already returns electricity unit prices
         * in p/kWh.
         *
         * DO NOT multiply by 100.
         */

        map.set(
          timestamp(dt),
          price
        );

      }


      return map;

    }


    /* ================================================================
       FORECAST DATA
       ================================================================ */

    function getNumber(object, names) {

      for (const name of names) {

        const value =
          Number(object?.[name]);


        if (Number.isFinite(value)) {

          return value;

        }

      }

      return null;

    }


    function extractLow(item) {

      let value =
        getNumber(
          item,
          [
            "agile_low",
            "agile_pred_low",
            "agile_pred_lower",
            "forecast_low",
            "forecast_lower",
            "prediction_low",
            "prediction_lower",
            "low",
            "lower",
            "p10"
          ]
        );


      /*
       * Also check nested objects.
       */

      if (value === null) {

        const objects = [

          item.high_low,
          item.bounds,
          item.interval,
          item.prediction_interval,
          item.confidence_interval

        ];


        for (const object of objects) {

          if (!object) {
            continue;
          }


          value =
            getNumber(
              object,
              [
                "low",
                "lower",
                "min",
                "lower_bound",
                "p10"
              ]
            );


          if (value !== null) {
            break;
          }

        }

      }


      return value;

    }


    function extractHigh(item) {

      let value =
        getNumber(
          item,
          [
            "agile_high",
            "agile_pred_high",
            "agile_pred_upper",
            "forecast_high",
            "forecast_upper",
            "prediction_high",
            "prediction_upper",
            "high",
            "upper",
            "p90"
          ]
        );


      if (value === null) {

        const objects = [

          item.high_low,
          item.bounds,
          item.interval,
          item.prediction_interval,
          item.confidence_interval

        ];


        for (const object of objects) {

          if (!object) {
            continue;
          }


          value =
            getNumber(
              object,
              [
                "high",
                "upper",
                "max",
                "upper_bound",
                "p90"
              ]
            );


          if (value !== null) {
            break;
          }

        }

      }


      return value;

    }


    function parseForecastJson(json) {

      const map = new Map();

      if (!json) {
        return map;
      }

      let record = null;

      if (Array.isArray(json)) {
        record = json[0];
      } else if (json && typeof json === "object") {
        record = json;
      }

      let rows = [];

      if (Array.isArray(record?.prices)) {
        rows = record.prices;
      }

      for (const item of rows) {

        if (!item.date_time) {
          continue;
        }

        const dt =
          luxon.DateTime
            .fromISO(
              item.date_time,
              {
                setZone: true
              }
            )
            .setZone(TIMEZONE);

        if (!dt.isValid) {
          continue;
        }

        const price = Number(item.agile_pred);
        const low = Number(item.agile_low);
        const high = Number(item.agile_high);

        if (!Number.isFinite(price)) {
          continue;
        }

        map.set(
          timestamp(dt),
          {
            price: price,

            low:
              Number.isFinite(low)
                ? low
                : null,

            high:
              Number.isFinite(high)
                ? high
                : null
          }
        );
      }

      return map;
    }
    /* ================================================================
       DUMMY ACTUAL DATA
       ================================================================ */

    function createDummyActual(start, endExclusive) {

      const map = new Map();

      const slots =
        makeSlotList(
          start,
          endExclusive
        );


      for (const dt of slots) {

        const hour =
          dt.hour +
          dt.minute / 60;


        /*
         * Artificial daily price shape.
         */

        let price =
          12 +
          Math.sin(
            (hour / 24) *
            Math.PI * 2
          ) * 5;


        /*
         * Morning peak.
         */

        if (
          hour >= 7 &&
          hour < 10
        ) {

          price += 8;

        }


        /*
         * Evening peak.
         */

        if (
          hour >= 16 &&
          hour < 20
        ) {

          price += 14;

        }


        /*
         * Small day-to-day variation.
         */

        price +=
          (dt.ordinal % 7) * 0.7;


        map.set(
          timestamp(dt),
          Number(price.toFixed(2))
        );

      }


      return map;

    }


    /* ================================================================
       DUMMY FORECAST DATA
       ================================================================ */

    function createDummyForecast(start, endExclusive) {

      const map = new Map();

      const slots =
        makeSlotList(
          start,
          endExclusive
        );


      for (const dt of slots) {

        const hour =
          dt.hour +
          dt.minute / 60;


        let price =
          13 +
          Math.sin(
            (hour / 24) *
            Math.PI * 2
          ) * 4;


        if (
          hour >= 7 &&
          hour < 10
        ) {

          price += 7;

        }


        if (
          hour >= 16 &&
          hour < 20
        ) {

          price += 12;

        }


        /*
         * Different forecast level each day.
         */

        price +=
          ((dt.ordinal % 6) - 3) * 0.8;


        const uncertainty =
          3 +
          Math.abs(
            Math.sin(hour / 24 * Math.PI)
          ) * 2;


        map.set(
          timestamp(dt),
          {
            price:
              Number(price.toFixed(2)),

            low:
              Number(
                (price - uncertainty)
                  .toFixed(2)
              ),

            high:
              Number(
                (price + uncertainty)
                  .toFixed(2)
              )
          }
        );

      }


      return map;

    }


    /* ================================================================
       DATASET BUILDING
       ================================================================ */

    function makeActualDataset(slots, map) {

      return slots.map(dt => {

        const x =
          timestamp(dt);

        const value =
          map.get(x);


        return {
          x,
          y:
            value === undefined
              ? null
              : value
        };

      });

    }


    function makeForecastDataset(
      slots,
      map,
      property
    ) {

      return slots.map(dt => {

        const x =
          timestamp(dt);

        const item =
          map.get(x);


        if (!item) {

          return {
            x,
            y: null
          };

        }


        const value =
          item[property];


        return {
          x,
          y:
            Number.isFinite(value)
              ? value
              : null
        };

      });

    }


    /* ================================================================
       CHART
       ================================================================ */

    function drawChart(
      actualDataset,
      forecastDataset,
      lowDataset,
      highDataset,
      start,
      endExclusive
    ) {

      const canvas =
        document
          .getElementById("priceChart");


      if (chart) {

        chart.destroy();

      }


      chart =
        new Chart(
          canvas.getContext("2d"),
          {

            type: "line",

            data: {

              datasets: [

                /* =====================================
                   ACTUAL
                   ===================================== */

                {
                  label:
                    "Actual Prices",

                  data:
                    actualDataset,

                  parsing: false,

                  borderColor:
                    "#4da3ff",

                  backgroundColor:
                    "#4da3ff",

                  borderWidth: 2.2,

                  pointRadius: 0,

                  pointHoverRadius: 5,

                  pointHitRadius: 10,

                  tension: 0,

                  spanGaps: false,

                  order: 10
                },


                /* =====================================
                   FORECAST LOW
                   ===================================== */

                {
                  label:
                    "Forecast Low",

                  data:
                    lowDataset,

                  parsing: false,

                  borderColor:
                    "rgba(255,159,67,0)",

                  backgroundColor:
                    "rgba(255,159,67,0)",

                  borderWidth: 0,

                  pointRadius: 0,

                  pointHitRadius: 0,

                  tension: 0,

                  spanGaps: false,

                  order: 1
                },


                /* =====================================
                   FORECAST HIGH / SHADED BAND
                   ===================================== */

                {
                  label:
                    "Forecast Range",

                  data:
                    highDataset,

                  parsing: false,

                  borderColor:
                    "rgba(255,159,67,0)",

                  backgroundColor:
                    "rgba(255,159,67,0.18)",

                  borderWidth: 0,

                  pointRadius: 0,

                  pointHitRadius: 0,

                  fill: 1,

                  tension: 0,

                  spanGaps: false,

                  order: 2
                },


                /* =====================================
                   FORECAST
                   ===================================== */

                {
                  label:
                    "Forecast Prices",

                  data:
                    forecastDataset,

                  parsing: false,

                  borderColor:
                    "#ff9f43",

                  backgroundColor:
                    "#ff9f43",

                  borderWidth: 2.4,

                  borderDash:
                    [7, 5],

                  pointRadius: 0,

                  pointHoverRadius: 5,

                  pointHitRadius: 10,

                  tension: 0,

                  spanGaps: false,

                  order: 5
                }

              ]

            },


            options: {

              responsive: true,

              maintainAspectRatio: false,

              normalized: true,


              interaction: {

                mode: "nearest",

                intersect: false

              },


              plugins: {

                title: {

                  display: true,

                  text:
                    "Octopus Agile Region G — 10-Day Prices",

                  color:
                    "#edf1f7",

                  font: {

                    size: 18,

                    weight: "600"

                  },

                  padding: {

                    bottom: 12

                  }

                },


                legend: {

                  display: true,

                  position: "top",

                  labels: {

                    color:
                      "#edf1f7",

                    usePointStyle: true,

                    padding: 16,

                    filter:
                      item => {

                        /*
                         * Only show:
                         *
                         * Actual
                         * Forecast
                         */

                        return (
                          item.datasetIndex === 0 ||
                          item.datasetIndex === 3
                        );

                      }

                  },


                  onClick:
                    (event, legendItem, legend) => {

                      const chart =
                        legend.chart;

                      if (
                        legendItem.datasetIndex === 0
                      ) {

                        chart.setDatasetVisibility(
                          0,
                          !chart.isDatasetVisible(0)
                        );

                      }


                      if (
                        legendItem.datasetIndex === 3
                      ) {

                        const visible =
                          chart.isDatasetVisible(3);

                        chart.setDatasetVisibility(
                          1,
                          !visible
                        );

                        chart.setDatasetVisibility(
                          2,
                          !visible
                        );

                        chart.setDatasetVisibility(
                          3,
                          !visible
                        );

                      }


                      chart.update();

                    }

                },


                tooltip: {

                  enabled: true,

                  callbacks: {

                    /*
                     * x is now ALWAYS a number.
                     *
                     * This is the direct fix for:
                     *
                     * fromMillis requires a numerical input
                     */

                    title:
                      items => {

                        if (
                          !items ||
                          !items.length
                        ) {

                          return "";

                        }


                        const milliseconds =
                          Number(
                            items[0].parsed.x
                          );


                        if (
                          !Number.isFinite(
                            milliseconds
                          )
                        ) {

                          return "";

                        }


                        return luxon.DateTime
                          .fromMillis(
                            milliseconds,
                            {
                              zone:
                                TIMEZONE
                            }
                          )
                          .toFormat(
                            "ccc d LLL yyyy, HH:mm"
                          );

                      },


                    label:
                      context => {

                        const value =
                          context.parsed.y;


                        if (
                          value === null ||
                          !Number.isFinite(value)
                        ) {

                          return (
                            context.dataset.label +
                            ": missing"
                          );

                        }


                        return (
                          context.dataset.label +
                          ": " +
                          value.toFixed(2) +
                          " p/kWh"
                        );

                      }

                  }

                }

              },


              scales: {

                x: {

                  type: "time",

                  min:
                    timestamp(start),

                  max:
                    timestamp(
                      endExclusive.minus({
                        minutes: 30
                      })
                    ),


                  adapters: {

                    date: {

                      zone:
                        TIMEZONE

                    }

                  },


                  time: {

                    unit: "day",

                    displayFormats: {

                      day:
                        "ccc d LLL",

                      hour:
                        "HH:mm"

                    },

                    tooltipFormat:
                      "ccc d LLL yyyy, HH:mm"

                  },


                  ticks: {

                    color:
                      "#9da6b5",

                    maxRotation: 0,

                    autoSkip: true,

                    autoSkipPadding: 20

                  },


                  grid: {

                    color:
                      "rgba(255,255,255,0.07)"

                  },


                  title: {

                    display: true,

                    text:
                      "Date / Time (Europe/London)",

                    color:
                      "#9da6b5"

                  }

                },


                y: {

                  ticks: {

                    color:
                      "#9da6b5",

                    callback:
                      value =>
                        value +
                        " p"

                  },


                  grid: {

                    color:
                      "rgba(255,255,255,0.07)"

                  },


                  title: {

                    display: true,

                    text:
                      "Price (p/kWh)",

                    color:
                      "#9da6b5"

                  },


                  beginAtZero: false

                }

              }

            }

          }
        );

    }


    /* ================================================================
       MAIN
       ================================================================ */

    function render() {

      try {

        showWarning("");

        setStatus(
          "Processing JSON...",
          ""
        );


        const today =
          londonToday();


        /*
         * Actual:
         *
         * D-3
         * D-2
         * D-1
         * Today
         *
         * 4 days
         */

        const actualStart =
          today.minus({
            days: 2
          });


        const forecastStart =
          today.plus({
            days: 1
          });


        /*
         * Forecast:
         *
         * Tomorrow
         * +2
         * +3
         * +4
         * +5
         * +6
         *
         * 6 days
         */

        const chartEnd =
          today.plus({
            days: 7
          });


        const actualSlots =
          makeSlotList(
            actualStart,
            forecastStart
          );


        const forecastSlots =
          makeSlotList(
            forecastStart,
            chartEnd
          );


        /* =========================================
           READ USER JSON
           ========================================= */

        const actualJson =
          parseJson(
            actualInput.value,
            "Actual JSON"
          );


        const forecastJson =
          parseJson(
            forecastInput.value,
            "Forecast JSON"
          );


        /* =========================================
           ACTUAL
           ========================================= */

        let actualMap;

        let usingDummyActual =
          !actualJson;


        if (usingDummyActual) {

          actualMap =
            createDummyActual(
              actualStart,
              forecastStart
            );

        } else {

          actualMap =
            parseActualJson(
              actualJson
            );

        }


        /* =========================================
           FORECAST
           ========================================= */

        let forecastMap;

        let usingDummyForecast =
          !forecastJson;


        if (usingDummyForecast) {

          forecastMap =
            createDummyForecast(
              forecastStart,
              chartEnd
            );

        } else {

          forecastMap =
            parseForecastJson(
              forecastJson
            );

        }


        /* =========================================
           DATASETS
           ========================================= */

        const actualDataset =
          makeActualDataset(
            actualSlots,
            actualMap
          );


        const forecastDataset =
          makeForecastDataset(
            forecastSlots,
            forecastMap,
            "price"
          );


        const lowDataset =
          makeForecastDataset(
            forecastSlots,
            forecastMap,
            "low"
          );


        const highDataset =
          makeForecastDataset(
            forecastSlots,
            forecastMap,
            "high"
          );


        /* =========================================
           COUNTS
           ========================================= */

        const actualPresent =
          actualDataset.filter(
            item =>
              item.y !== null
          ).length;


        const forecastPresent =
          forecastDataset.filter(
            item =>
              item.y !== null
          ).length;


        const lowPresent =
          lowDataset.filter(
            item =>
              item.y !== null
          ).length;


        const highPresent =
          highDataset.filter(
            item =>
              item.y !== null
          ).length;


        const actualMissing =
          actualSlots.length -
          actualPresent;


        const forecastMissing =
          forecastSlots.length -
          forecastPresent;


        /* =========================================
           DRAW
           ========================================= */

        drawChart(
          actualDataset,
          forecastDataset,
          lowDataset,
          highDataset,
          actualStart,
          chartEnd
        );


        /* =========================================
           INFO
           ========================================= */

        document.getElementById(
          "actualInfo"
        ).textContent =
          `${actualPresent}/${actualSlots.length} slots` +
          (
            usingDummyActual
              ? " · dummy"
              : " · pasted JSON"
          );


        document.getElementById(
          "forecastInfo"
        ).textContent =
          `${forecastPresent}/${forecastSlots.length} slots` +
          (
            usingDummyForecast
              ? " · dummy"
              : " · pasted JSON"
          );


        document.getElementById(
          "missingActual"
        ).textContent =
          actualMissing;


        document.getElementById(
          "missingForecast"
        ).textContent =
          forecastMissing;


        /* =========================================
           WARNINGS
           ========================================= */

        const warnings = [];


        // missing at least 1 whole day data (48 half-hour slots)
        if (actualMissing > 48) {

          warnings.push(
            `Actual data missing ${actualMissing} of ${actualSlots.length} half-hour slots.`
          );

        }


        if (forecastMissing > 0) {

          warnings.push(
            `Forecast data missing ${forecastMissing} slots.`
          );

        }


        if (
          !usingDummyForecast &&
          (lowPresent === 0 || highPresent === 0)
        ) {

          warnings.push(
            "Forecast price loaded, but no high/low interval was found in the pasted JSON."
          );

        }


        if (warnings.length) {

          showWarning(
            warnings.join(" ")
          );


          setStatus(
            "Chart loaded with warnings. " +
            warnings.join(" "),
            "warning"
          );

        } else {

          setStatus(
            "Chart loaded successfully. " +
            (
              usingDummyActual
                ? "Actual data is dummy data. "
                : "Actual data is from pasted JSON. "
            ) +
            (
              usingDummyForecast
                ? "Forecast data is dummy data."
                : "Forecast data is from pasted JSON."
            ),
            "ok"
          );

        }

      } catch (error) {

        console.error(error);


        setStatus(
          error.message ||
          String(error),
          "error"
        );


        showWarning(
          "Could not draw the chart. Check the JSON format."
        );

      }

    }


    /* ================================================================
       BUTTONS
       ================================================================ */

    document
      .getElementById("drawButton")
      .addEventListener(
        "click",
        render
      );


    document
      .getElementById("clearButton")
      .addEventListener(
        "click",
        () => {

          actualInput.value = "";
          forecastInput.value = "";

          render();

        }
      );


    document
      .getElementById("dummyButton")
      .addEventListener(
        "click",
        () => {

          actualInput.value = "";
          forecastInput.value = "";

          render();

        }
      );


    /* ================================================================
       INITIAL DRAW
       ================================================================ */

    /*
     * Both inputs are empty on first load.
     *
     * Therefore:
     *
     * Actual    → dummy
     * Forecast  → dummy
     *
     * The chart should immediately show all 10 days.
     */

    render();

  </script>

</body>

</html>
