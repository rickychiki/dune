<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動漫 Hitster</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .card {
            width: 350px;
            height: 500px;
            perspective: 1000px;
            cursor: pointer;
        }

        .inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card.flipped .inner {
            transform: rotateY(180deg);
        }

        .side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .back {
            background: #1db954;
        }

        .front {
            background: #222;
            transform: rotateY(180deg);
        }

        .back .block {
            width: 300px;
            height: 352px;
            position: absolute;
            /* background-color: #1db954; */
            top: 0;
            transition: opacity 0.1s;
            /* 快速淡出 */
            z-index: 5;
            pointer-events: none;

        }

        /* 翻轉時快速消失 */
        .card.flipped .back .block {
            opacity: 0;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

    </div>

        let current = null;

        function newSong() {
            const card = document.getElementById("card");

            // 1️⃣ 如果卡片已翻面，先翻回去
            if (card.classList.contains("flipped")) {
                card.classList.remove("flipped");
            }
            setTimeout(() => {
                // 過濾掉已抽過的歌曲
                const available = tracks.filter(track => !drawnList.includes(track["Spotify Track Id"]));

                if (available.length === 0) {
                    alert("所有歌曲已抽完，重新開始！");
                    drawnList = [];
                    return newSong(); // 重新抽
                }

                // 隨機抽
                current = available[Math.floor(Math.random() * available.length)];

                // 記錄已抽過
                drawnList.push(current["Spotify Track Id"]);


                document.getElementById("trackName").innerText = current.Song;
                document.getElementById("artistName").innerText = current.Album;
                document.getElementById("releaseYear").innerText = current["Album Date"]?.substring(0, 4) || "未知";

                document.getElementById("spotifyEmbed").innerHTML = `
    <iframe style="
        width:100%;
        height:352px;
        border-radius:12px;"
        src="https://open.spotify.com/embed/track/${current["Spotify Track Id"]}"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
    <div class ="block"></div>
`;
            }, 800); // 0.8s =
        }

        function flipCard() {
            document.getElementById("card").classList.toggle("flipped");
        }

        newSong();
