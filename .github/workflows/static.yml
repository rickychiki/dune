# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]

  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Agile API data and prepare site
        run: |
          mkdir -p _site
          # 把所有非隱藏檔案複製到 _site（自動排除 .git 和 .github）
          cp -r $(ls -A | grep -vE '^\.git|^\.github|^_site$') _site/
          curl -fsSL "https://agilepredict.com/api/G/?days=10&forecast_count=1&format=json&high_low=true" -o _site/agile.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
